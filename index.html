<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Как устроена ипотека</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f3ef; --surface:#ffffff; --ink:#1a1d24; --muted:#5b616c; --line:#dcdfe2; --track:#e4e6e8;
  --now:#b86e0e; --later:#3b4fa3; --later-soft:#d3d9f3; --ok:#2d7a46; --home:#5f8f3e; --on-accent:#ffffff;
  --sans:'Golos Text', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --display:'Unbounded', 'Golos Text', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121419; --surface:#1b1e25; --ink:#eceef2; --muted:#9aa1ad; --line:#2d323b; --track:#2d323b;
    --now:#f0a640; --later:#8d9cf0; --later-soft:#2d3563; --ok:#6cc58a; --home:#a3cf7e; --on-accent:#121419;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121419; --surface:#1b1e25; --ink:#eceef2; --muted:#9aa1ad; --line:#2d323b; --track:#2d323b;
  --now:#f0a640; --later:#8d9cf0; --later-soft:#2d3563; --ok:#6cc58a; --home:#a3cf7e; --on-accent:#121419;
  color-scheme: dark;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
body{ margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 var(--sans); -webkit-text-size-adjust:100%; }
main{ max-width:760px; margin:0 auto; padding:18px 18px 48px; }

.top{ display:flex; justify-content:flex-end; margin-bottom:10px; }
h1{ font-family:var(--display); font-weight:700; font-size:clamp(26px,7vw,40px); line-height:1.12; letter-spacing:-0.01em; margin:4px 0 10px; }
h2{ font-family:var(--display); font-weight:500; font-size:clamp(19px,5vw,24px); line-height:1.25; margin:0 0 10px; }
h3{ font-size:17px; font-weight:600; margin:0 0 6px; }
.lead{ color:var(--muted); max-width:60ch; margin:0 0 22px; }

.panel{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px 18px 6px; }
.ctls{ display:grid; grid-template-columns:1fr; column-gap:28px; }
@media (min-width:640px){ .ctls{ grid-template-columns:1fr 1fr; } }
.ctl{ margin-bottom:16px; }
.ctl-head{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
.ctl-head label, .ctl-head .lbl{ font-weight:500; }
.val{ font-variant-numeric:tabular-nums; font-weight:600; text-align:right; white-space:nowrap; }
.hint{ color:var(--muted); font-size:13.5px; line-height:1.4; margin:2px 0 0; }

input[type=range]{ -webkit-appearance:none; appearance:none; width:100%; height:30px; background:transparent; margin:2px 0 0; --thumb:var(--ink); }
input[type=range].now{ --thumb:var(--now); }
input[type=range].later{ --thumb:var(--later); }
input[type=range]::-webkit-slider-runnable-track{ height:6px; border-radius:3px; background:var(--track); }
input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:22px; height:22px; border-radius:50%; background:var(--thumb); border:3px solid var(--surface); box-shadow:0 0 0 1px var(--line); margin-top:-8px; cursor:pointer; }
input[type=range]::-moz-range-track{ height:6px; border-radius:3px; background:var(--track); }
input[type=range]::-moz-range-thumb{ box-sizing:border-box; width:22px; height:22px; border-radius:50%; background:var(--thumb); border:3px solid var(--surface); box-shadow:0 0 0 1px var(--line); cursor:pointer; }
input[type=range]:focus-visible{ outline:2px solid var(--later); outline-offset:3px; border-radius:6px; }

.switch{ display:inline-flex; border:1px solid var(--line); border-radius:999px; padding:3px; background:var(--surface); }
.switch button{ font:inherit; font-size:14px; border:0; background:transparent; color:var(--ink); padding:5px 13px; border-radius:999px; cursor:pointer; }
.switch button[aria-pressed="true"]{ background:var(--ink); color:var(--bg); }
.switch button:focus-visible, .b:focus-visible{ outline:2px solid var(--later); outline-offset:2px; }

.ledger{ display:grid; grid-template-columns:1fr 1fr; column-gap:18px; margin:22px 0 6px; border-top:2px solid var(--ink); }
.fig{ padding:12px 0 14px; border-bottom:1px solid var(--line); }
.fig .k{ font-size:14px; color:var(--muted); }
.fig .v{ font-size:clamp(22px,6.2vw,32px); font-weight:700; font-variant-numeric:tabular-nums; line-height:1.2; margin:2px 0; }
.fig .s{ font-size:13px; color:var(--muted); line-height:1.35; min-height:2.7em; }
#sMonthly, #sUpfront{ min-height:4.05em; }
.seg-other{ background:var(--muted); }
.seg-pre{ background:var(--later); }
.cash-bar.who{ height:12px; margin-top:12px; }
.seg-mine{ background:var(--ink); }
.seg-seller, .sw-seller{ background:repeating-linear-gradient(135deg, var(--muted) 0 3px, transparent 3px 6px); }
.fig.now .v{ color:var(--now); }
.fig.later .v{ color:var(--later); }

.notes{ list-style:none; padding:0; margin:12px 0 0; }
.notes li{ position:relative; padding-left:16px; margin:7px 0; font-size:15px; line-height:1.45; }
.notes li::before{ content:""; position:absolute; left:0; top:.55em; width:7px; height:7px; border-radius:50%; background:var(--muted); }

.apr{ margin-top:40px; }
.apr > p{ max-width:62ch; }
.eq{ display:grid; grid-template-columns:1fr auto 1fr auto 1fr; align-items:start; column-gap:8px; margin:22px 0 10px; }
.eq .n{ font-size:clamp(17px,5vw,28px); font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap; line-height:1.2; }
.eq .c{ font-size:12.5px; color:var(--muted); line-height:1.3; margin-top:3px; }
.eq .op{ font-size:clamp(19px,5.4vw,30px); line-height:1.1; color:var(--muted); font-weight:500; }
.eq .op.sign{ color:var(--ink); font-weight:700; min-width:1ch; text-align:center; }
.eq .op.sign.ok{ color:var(--ok); }
.t-fee .n{ color:var(--now); }
.t-pv .n{ color:var(--later); }

.bars{ margin:16px 0 20px; }
.bar-name{ font-size:13.5px; color:var(--muted); margin:10px 0 4px; }
.track{ position:relative; height:24px; border-radius:6px; background:var(--track); display:flex; }
.seg{ height:100%; transition:width .25s ease; }
.seg-loan{ background:var(--ink); border-radius:6px; }
.seg-fee{ background:var(--now); border-radius:6px 0 0 6px; }
.seg-pv{ background:var(--later); border-radius:0 6px 6px 0; }
.seg-fee.solo{ border-radius:6px; }
.seg-pv.solo{ border-radius:6px; }
.marker{ position:absolute; top:-5px; bottom:-5px; width:0; border-left:2px dashed var(--ink); transition:left .25s ease; }

.disc{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px 18px; }
.marks{ position:relative; height:30px; }
.mk{ position:absolute; top:0; width:0; }
.mk .tick{ position:absolute; left:-1px; top:0; width:2px; height:7px; background:currentColor; }
.mk .lab{ position:absolute; top:8px; transform:translateX(-50%); font-size:12px; white-space:nowrap; }
.mk.l .lab{ transform:translateX(calc(-100% + 4px)); }
.mk.r .lab{ transform:translateX(-4px); }
.mk-rate{ color:var(--muted); }
.mk-apr{ color:var(--ok); }
.btns{ display:flex; gap:8px; flex-wrap:wrap; margin-top:4px; }
.b{ font:inherit; font-size:14px; padding:8px 15px; border-radius:999px; border:1px solid var(--line); background:transparent; color:var(--ink); cursor:pointer; }
.b.primary{ background:var(--later); border-color:var(--later); color:var(--on-accent); font-weight:600; }
.status{ font-weight:600; margin:16px 0 4px; }
.status.ok{ color:var(--ok); }
.insight{ margin:0; max-width:62ch; }

.chart-wrap{ margin-top:34px; }
.legend{ display:flex; flex-wrap:wrap; gap:6px 18px; font-size:13px; color:var(--muted); margin:4px 0 8px; }
.sw{ display:inline-block; width:11px; height:11px; border-radius:2px; margin-right:6px; vertical-align:-1px; }
#chart{ width:100%; }
#chart svg{ display:block; }
#chart text{ fill:var(--muted); font-size:11px; font-family:var(--sans); }
.cap{ font-size:14.5px; margin:8px 0 0; max-width:62ch; }
.foot{ color:var(--muted); font-size:13px; margin-top:34px; border-top:1px solid var(--line); padding-top:12px; }

.trade{ margin-top:40px; }
.trade > p{ max-width:62ch; }
.total{ margin:18px 0 4px; }
.total-k{ font-size:14px; color:var(--muted); }
.total-v{ font-size:clamp(28px,8vw,40px); font-weight:700; font-variant-numeric:tabular-nums; line-height:1.15; margin:2px 0 12px; }
.split-bar{ position:relative; display:flex; height:26px; border-radius:6px; background:var(--track); }
.seg-now{ background:var(--now); border-radius:6px 0 0 6px; }
.seg-borrow{ background:var(--later); border-radius:0 6px 6px 0; }
.sw-line{ width:0; height:14px; border-radius:0; border-left:2px dashed var(--ink); background:none; margin:0 9px 0 4px; }
.total .legend{ margin-top:8px; }
.cash-bar{ display:flex; height:26px; border-radius:6px; overflow:hidden; background:var(--track); margin-top:6px; }
.seg-bank{ background:var(--now); }
.seg-home{ background:var(--home); }
.trade .legend{ margin:8px 0 4px; }
.rolled{ font-size:14.5px; margin:4px 0 18px; max-width:62ch; }
.delta{ font-size:15px; font-weight:600; color:var(--now); margin-top:-6px; }
#curve{ width:100%; margin-top:16px; touch-action:pan-y; cursor:pointer; -webkit-user-select:none; user-select:none; }
#curve svg{ display:block; }
#curve text{ fill:var(--muted); font-size:11px; font-family:var(--sans); font-variant-numeric:tabular-nums; }
#curve .lbl-cur{ fill:var(--later); font-weight:700; font-size:12.5px; }
.trade .ctl{ margin-top:6px; }
.notes li.cur{ color:var(--later); font-weight:600; }

.choose{ margin:0 0 24px; }
.choose h2{ margin-bottom:12px; }
.choices{ display:grid; grid-template-columns:1fr; gap:10px; }
.ch{ border-top:4px solid currentColor; background:var(--surface); border-radius:0 0 12px 12px; padding:11px 14px 13px; display:grid; grid-template-columns:140px 1fr; column-gap:12px; align-items:baseline; }
@media (min-width:560px){ .choices{ grid-template-columns:repeat(3,1fr); } .ch{ grid-template-columns:1fr; } }
.ch-w{ font-family:var(--display); font-weight:700; font-size:20px; line-height:1.25; }
.ch-t{ color:var(--ink); font-size:14.5px; line-height:1.4; }
.c-bank, .p-bank{ color:var(--now); }
.c-home, .p-home{ color:var(--home); }
.c-ins, .p-ins{ color:var(--later); }
.p-budget{ color:var(--muted); }
.lh{ display:inline-flex; align-items:center; flex-wrap:wrap; gap:2px 8px; min-width:0; }
.pill{ font-size:11.5px; font-weight:600; line-height:1.5; padding:0 8px; border-radius:999px; border:1.5px solid currentColor; }

:root{ --bad:#b3261e; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bad:#f2867c; } }
:root[data-theme="dark"]{ --bad:#f2867c; }
.verdict{ font-size:17px; font-weight:600; line-height:1.4; margin:16px 0 4px; padding:12px 14px; border-left:4px solid var(--bad); background:var(--surface); border-radius:0 10px 10px 0; }
.verdict.ok{ border-left-color:var(--ok); }
.hint.est{ font-style:italic; color:var(--ink); }

@media (prefers-reduced-motion: reduce){ .seg, .marker{ transition:none; } }
</style>
</head>
<body>
<main>
  <div class="top">
    <div class="switch" role="group" aria-label="Language">
      <button id="langRu" type="button">RU</button>
      <button id="langEn" type="button">EN</button>
    </div>
  </div>

  <h1 data-t="title"></h1>
  <p class="lead" data-t="lead"></p>

  <section class="choose" aria-labelledby="chooseH">
    <h2 id="chooseH" data-t="chooseH"></h2>
    <div class="choices">
      <div class="ch c-bank"><div class="ch-w" data-t="chBank"></div><div class="ch-t" data-t="chBankT"></div></div>
      <div class="ch c-home"><div class="ch-w" data-t="chHome"></div><div class="ch-t" data-t="chHomeT"></div></div>
      <div class="ch c-ins"><div class="ch-w" data-t="chIns"></div><div class="ch-t" data-t="chInsT"></div></div>
    </div>
  </section>

  <section class="panel" aria-labelledby="termsH">
    <h3 id="termsH" data-t="termsH" style="margin-bottom:12px"></h3>
    <div class="ctls">
      <div class="ctl">
        <div class="ctl-head"><span class="lh"><label for="price" data-t="price"></label><span class="pill p-home" data-t="pHome"></span></span><span class="val" id="priceV"></span></div>
        <input type="range" id="price" min="150000" max="300000" step="5000" value="200000">
      </div>
      <div class="ctl">
        <div class="ctl-head"><span class="lh"><label for="cash" data-t="down"></label><span class="pill p-budget" data-t="pBudget"></span></span><span class="val" id="downV"></span></div>
        <input type="range" id="cash" class="now" min="5000" max="40000" step="500" value="20000">
        <p class="hint" data-t="downHint"></p>
      </div>
      <div class="ctl">
        <div class="ctl-head"><span class="lh"><label for="budget" data-t="budget"></label><span class="pill p-budget" data-t="pBudget"></span></span><span class="val" id="budgetV"></span></div>
        <input type="range" id="budget" min="1000" max="4000" step="10" value="1500">
        <p class="hint" data-t="budgetHint"></p>
      </div>
      <div class="ctl">
        <div class="ctl-head"><span class="lh"><label for="rate" data-t="rate"></label><span class="pill p-bank" data-t="pBank"></span></span><span class="val" id="rateV"></span></div>
        <input type="range" id="rate" class="later" min="2" max="10" step="0.125" value="6">
        <p class="hint" data-t="rateHint"></p>
      </div>
      <div class="ctl">
        <div class="ctl-head"><span class="lh"><span class="lbl" data-t="term"></span><span class="pill p-bank" data-t="pBank"></span></span>
          <div class="switch" role="group">
            <button id="t15" type="button"></button>
            <button id="t30" type="button"></button>
          </div>
        </div>
      </div>
      <div class="ctl">
        <div class="ctl-head"><span class="lh"><label for="fees" data-t="fees"></label><span class="pill p-bank" data-t="pBank"></span></span><span class="val" id="feesV"></span></div>
        <input type="range" id="fees" class="now" min="0" max="15000" step="250" value="6000">
        <p class="hint" data-t="feesHint"></p>
      </div>
      <div class="ctl">
        <div class="ctl-head"><span class="lh"><label for="other" data-t="other"></label></span><span class="val" id="otherV"></span></div>
        <input type="range" id="other" min="0" max="15000" step="50" value="3000">
        <p class="hint" data-t="otherHint"></p>
        <p class="hint est" id="otherEst" data-t="otherEst"></p>
      </div>
      <div class="ctl">
        <div class="ctl-head"><span class="lh"><label for="pre" data-t="pre"></label></span><span class="val" id="preV"></span></div>
        <input type="range" id="pre" min="0" max="6000" step="50" value="1600">
        <p class="hint" data-t="preHint"></p>
        <p class="hint est" id="preEst" data-t="preEst"></p>
      </div>
      <div class="ctl">
        <div class="ctl-head"><span class="lh"><label for="hoa">HOA</label><span class="pill p-home" data-t="pHome"></span></span><span class="val" id="hoaV"></span></div>
        <input type="range" id="hoa" class="later" min="0" max="800" step="10" value="250">
        <p class="hint" data-t="hoaHint"></p>
      </div>
      <div class="ctl">
        <div class="ctl-head"><span class="lh"><label for="ins" data-t="ins"></label><span class="pill p-ins" data-t="pIns"></span></span><span class="val" id="insV"></span></div>
        <input type="range" id="ins" class="later" min="0" max="400" step="5" value="50">
        <p class="hint" data-t="insHint"></p>
      </div>
      <div class="ctl">
        <div class="ctl-head"><span class="lh"><label for="pmi">PMI</label><span class="pill p-bank" data-t="pBank"></span></span><span class="val" id="pmiV"></span></div>
        <input type="range" id="pmi" class="later" min="0" max="300" step="5" value="100">
        <p class="hint" data-t="pmiHint"></p>
      </div>
      <div class="ctl">
        <div class="ctl-head"><span class="lh"><label for="tax" data-t="tax"></label><span class="pill p-home" data-t="pHome"></span></span><span class="val" id="taxV"></span></div>
        <input type="range" id="tax" class="later" min="0" max="800" step="10" value="180">
        <p class="hint" data-t="taxHint"></p>
      </div>
    </div>
  </section>

  <div class="ledger">
    <div class="fig later"><div class="k" data-t="monthly"></div><div class="v" id="vMonthly"></div><div class="s" id="sMonthly"></div></div>
    <div class="fig now"><div class="k" data-t="upfront"></div><div class="v" id="vUpfront"></div><div class="s" id="sUpfront"></div></div>
    <div class="fig"><div class="k">APR</div><div class="v" id="vApr"></div><div class="s" id="sApr"></div></div>
    <div class="fig"><div class="k" data-t="cost"></div><div class="v" id="vCost"></div><div class="s" id="sCost"></div></div>
  </div>
  <p class="verdict" id="verdict" aria-live="polite"></p>
  <ul class="notes" id="notes"></ul>

  <section class="trade" aria-labelledby="tradeH">
    <h2 id="tradeH" data-t="tradeH"></h2>
    <p data-t="tradeP"></p>
    <div class="total-k" id="barK"></div>
    <div class="cash-bar" aria-hidden="true"><div class="seg seg-home" id="spHome"></div><div class="seg seg-bank" id="spBank"></div><div class="seg seg-other" id="spOther"></div><div class="seg seg-pre" id="spPre"></div></div>
    <div class="legend"><span><span class="sw" style="background:var(--home)"></span><span id="lgHome"></span></span><span><span class="sw" style="background:var(--now)"></span><span id="lgBank"></span></span><span><span class="sw" style="background:var(--muted)"></span><span id="lgOther"></span></span><span><span class="sw" style="background:var(--later)"></span><span id="lgPre"></span></span></div>
    <div class="cash-bar who" aria-hidden="true"><div class="seg seg-mine" id="spMine"></div><div class="seg seg-seller" id="spSeller"></div></div>
    <div class="legend"><span><span class="sw" style="background:var(--ink)"></span><span id="lgMine"></span></span><span><span class="sw sw-seller"></span><span id="lgSeller"></span></span></div>
    <p class="rolled" id="rolled"></p>
    <div class="total-k" data-t="monthlyK"></div>
    <div class="total-v" id="totV"></div>
    <div class="delta" id="delta"></div>
    <div id="curve" role="img"></div>
    <div class="ctl">
      <div class="ctl-head"><span class="lh"><label for="fees2" data-t="fees"></label><span class="pill p-bank" data-t="pBank"></span></span><span class="val" id="fees2V"></span></div>
      <input type="range" id="fees2" class="now" min="0" max="15000" step="250" value="6000">
    </div>
    <ul class="notes" id="slopes"></ul>
  </section>

  <section class="apr" aria-labelledby="aprH">
    <h2 id="aprH" data-t="aprH"></h2>
    <p data-t="aprP"></p>

    <div class="eq" aria-live="polite">
      <div class="t-loan"><div class="n" id="eqLoan"></div><div class="c" data-t="eqLoan"></div></div>
      <div class="op sign" id="eqSign">=</div>
      <div class="t-fee"><div class="n" id="eqFee"></div><div class="c" data-t="eqFee"></div></div>
      <div class="op">+</div>
      <div class="t-pv"><div class="n" id="eqPv"></div><div class="c" id="cPv"></div></div>
    </div>

    <div class="bars" aria-hidden="true">
      <div class="bar-name" data-t="barLoan"></div>
      <div class="track"><div class="seg seg-loan" id="segLoan"></div></div>
      <div class="bar-name" data-t="barYou"></div>
      <div class="track"><div class="seg seg-fee" id="segFee"></div><div class="seg seg-pv" id="segPv"></div><div class="marker" id="marker"></div></div>
    </div>

    <div class="disc">
      <div class="ctl-head"><label for="disc" data-t="discL"></label><span class="val" id="discV"></span></div>
      <input type="range" id="disc" class="later" min="4" max="9" step="0.01" value="6">
      <div class="marks" id="marks">
        <div class="mk mk-rate" id="mkRate"><span class="tick"></span><span class="lab" id="mkRateL"></span></div>
        <div class="mk mk-apr" id="mkApr"><span class="tick"></span><span class="lab" id="mkAprL"></span></div>
      </div>
      <div class="btns">
        <button class="b" id="btnRate" type="button" data-t="btnRate"></button>
        <button class="b primary" id="btnApr" type="button" data-t="btnApr"></button>
      </div>
      <p class="status" id="status" aria-live="polite"></p>
      <p class="insight" id="insight"></p>
    </div>

    <div class="chart-wrap">

  function numMax1(v){ return new Intl.NumberFormat(loc(), { maximumFractionDigits:1 }).format(v); }
  function clamp(v, a, b){ return Math.min(b, Math.max(a, v)); }

  function pmt(loan, ratePct, n){ var i = ratePct / 1200; if (i === 0) return loan / n; return loan * i / (1 - Math.pow(1 + i, -n)); }
  function pv(m, ratePct, n){ var i = ratePct / 1200; if (i === 0) return m * n; return m * (1 - Math.pow(1 + i, -n)) / i; }
  function solveAPR(m, n, net, pmi, K){
    net = Math.max(net, 1);
    var lo = 0, hi = 60;
    for (var k = 0; k < 120; k++){ var mid = (lo + hi) / 2; if (pv(m, mid, n) + (K ? pv(pmi, mid, K) : 0) > net) lo = mid; else hi = mid; }
    return (lo + hi) / 2;
  }

  function model(){
    var note = Math.max(0.25, S.rate - S.points * POINT_CUT);
    var n = S.term * 12;
    var pointsCost = 0, upfrontFees = S.fees;
    var C = S.fees + S.other + S.pre, X = 0, short = 0, P2 = S.price, down;
    if (S.cash >= MIN_DOWN * S.price + C){ down = S.cash - C; }
    else {
      X = Math.min(C, (C + MIN_DOWN * S.price - S.cash) / (1 - MIN_DOWN));
      P2 = S.price + X;
      down = S.cash - (C - X);
      short = Math.max(0, MIN_DOWN * P2 - down);
    }
    var loan = P2 - down;
    var M = pmt(loan, note, n);
    var K = 0;
    if (S.pmi > 0){
      var jr = note / 1200, lim = 0.78 * P2, bal = loan;
      while (bal > lim && K < n){ bal = bal * (1 + jr) - M; K++; }
    }
    var apr = (upfrontFees > 0.5 || K > 0) ? solveAPR(M, n, loan - upfrontFees, S.pmi, K) : note;
    return { pmiK:K, pmiNow:(K > 0 ? S.pmi : 0), down:down, X:X, P2:P2, short:short, C:C, downPct:down / P2 * 100, loan:loan, note:note, n:n, M:M, pointsCost:pointsCost, upfrontFees:upfrontFees, apr:apr, interest:M * n - loan };
  }

  var last = null;

    $('sUpfront').textContent = m.X > 0.5 ? t.upfrontSub2(money(m.down), money(m.C - m.X), money(m.X)) : t.upfrontSub(money(S.fees), money(S.other), money(S.pre), money(m.down));
    $('vApr').textContent = pct(m.apr);

    else {

      else {

        var p0 = (Lb + S.cash - fx) / (1 + aP), p1 = (Lb + S.cash - fx - S.fees) / (1 + aP);
        vt = S.fees > 0 ? t.vPrice(money(over), money(Math.floor(p1 / 1000) * 1000), money(S.fees), money(Math.floor(p0 / 1000) * 1000)) : t.vPrice0(money(over), money(Math.floor(p0 / 1000) * 1000));
      }

    var notes = [];

    // discount rate
    var dmin = Math.max(0.25, Math.floor((m.note - 2) * 4) / 4);

    var st = $('status');
    st.className = 'status' + (balanced ? ' ok' : '');

    $('insight').textContent = noFees ? t.inNoFee : (atRate ? t.inRate(money(m.loan), [m.upfrontFees >= 0.5 ? t.wFees(money(m.upfrontFees)) : '', m.pmiK ? 'PMI' : ''].filter(Boolean).join(t.wAnd)) : (balanced ? t.inApr : t.inFind));

    drawTrade(m);
    drawChart(m);
  }

  function niceStep(raw){ var p = Math.pow(10, Math.floor(Math.log(raw) / Math.LN10)), f = raw / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }
  var CPL = 64, CPR = 10;
  function payFor(fees, r, n){ return pmt((S.price - S.cash + fees + S.other + S.pre) / (1 - S.points / 100), r, n) + S.hoa + S.ins + S.tax + pmiOn; }
  var FMAX = 15000, pmiOn = 0;
  function drawTrade(m){
    var t = L();
    var T = m.down + m.C;
    $('barK').textContent = t.barK(money(T));
    $('spHome').style.width = (m.down / T * 100) + '%';
    $('spBank').style.width = (S.fees / T * 100) + '%';
    $('spOther').style.width = (S.other / T * 100) + '%';
    $('spPre').style.width = (S.pre / T * 100) + '%';
    $('spMine').style.width = (S.cash / T * 100) + '%';
    $('spSeller').style.width = (m.X / T * 100) + '%';
    $('lgHome').textContent = t.lgHome(money(m.down));
    $('lgBank').textContent = t.lgBank(money(S.fees));
    $('lgOther').textContent = t.lgOther(money(S.other));
    $('lgPre').textContent = t.lgPre(money(S.pre));
    $('lgMine').textContent = t.lgMine(money(S.cash));
    $('lgSeller').textContent = t.lgSeller(money(m.X));
    var msg;
    if (m.C < 0.5) msg = t.rolledZero;
    else if (m.X < 0.5) msg = t.rolledNo(money(m.C));
    else if (m.short > 0.5) msg = t.rolledShort(money(MIN_DOWN * m.P2), money(m.short));
    else msg = t.rolledYes(money(m.P2), money(m.X)) + (m.X > 0.06 * m.P2 ? t.rolledLimit : '');
    $('rolled').textContent = msg;
    pmiOn = m.pmiNow;
    $('totV').textContent = money(m.M + S.hoa + S.ins + S.tax + m.pmiNow);
    $('delta').textContent = m.upfrontFees < 0.5 ? t.deltaNo : t.delta(money(pmt(m.upfrontFees, m.note, m.n)));

    var box = $('curve');
    var W = Math.max(260, box.clientWidth || 340), H = 230, pt = 12, pb = 38;
    var kf = new Intl.NumberFormat(loc(), { style:'currency', currency:'USD', notation:'compact', maximumFractionDigits:0 });
    var rates = [Math.max(0.25, m.note - 1), m.note, m.note + 1];
    var lo = payFor(0, rates[0], m.n), hi = payFor(FMAX, rates[2], m.n);
    var B = S.budget, span = hi - lo, showB = B >= lo - span && B <= hi + span, hi0 = hi;
    if (showB){ lo = Math.min(lo, B); hi = Math.max(hi, B); }
    var stepY = niceStep((hi - lo) / 4), botY = Math.floor(lo / stepY) * stepY, topY = Math.ceil(hi / stepY) * stepY;
    function X(f){ return CPL + f / FMAX * (W - CPL - CPR); }
    function Y(v){ return pt + (1 - (v - botY) / (topY - botY)) * (H - pt - pb); }
    var g = '', v;
    for (v = botY; v <= topY + 0.5; v += stepY){
      var gy = Y(v).toFixed(1);
      g += '<line x1="' + CPL + '" x2="' + (W - CPR) + '" y1="' + gy + '" y2="' + gy + '" stroke="var(--line)" stroke-width="1"/>';
      g += '<text x="' + (CPL - 6) + '" y="' + (Y(v) + 4).toFixed(1) + '" text-anchor="end">' + money(v) + '</text>';
    }
    rates.forEach(function(r, k){
      var cur = k === 1, y0 = Y(payFor(0, r, m.n)), y1 = Y(payFor(FMAX, r, m.n));
      g += '<line x1="' + X(0).toFixed(1) + '" y1="' + y0.toFixed(1) + '" x2="' + X(FMAX).toFixed(1) + '" y2="' + y1.toFixed(1) + '" stroke="' + (cur ? 'var(--later)' : 'var(--muted)') + '" stroke-width="' + (cur ? 3 : 1.5) + '" stroke-linecap="round"/>';
      g += '<text x="' + (X(0) + 4).toFixed(1) + '" y="' + (y0 - 6).toFixed(1) + '"' + (cur ? ' class="lbl-cur"' : '') + '>' + pct(r) + '</text>';
    });
    if (showB){
      var yb = Y(B).toFixed(1);
      g += '<rect x="' + CPL + '" y="' + pt + '" width="' + (W - CPL - CPR) + '" height="' + Math.max(0, Y(B) - pt).toFixed(1) + '" fill="var(--bad)" opacity="0.07"/>';
      g += '<line x1="' + CPL + '" x2="' + (W - CPR) + '" y1="' + yb + '" y2="' + yb + '" stroke="var(--bad)" stroke-width="1.5" stroke-dasharray="6 4"/>';
      g += '<text x="' + (W - CPR - 2) + '" y="' + (Y(B) - 5).toFixed(1) + '" text-anchor="end" style="fill:var(--bad);font-weight:600">' + t.bLine(money(B)) + '</text>';
      if (m.fMax !== undefined && m.fMax >= 0 && m.fMax <= FMAX){
        var xc = X(m.fMax), an2 = m.fMax > FMAX * 0.8 ? 'end' : (m.fMax < FMAX * 0.2 ? 'start' : 'middle');
        g += '<circle cx="' + xc.toFixed(1) + '" cy="' + yb + '" r="4.5" fill="var(--surface)" stroke="var(--bad)" stroke-width="2"/>';
        g += '<text x="' + xc.toFixed(1) + '" y="' + (Y(B) + 16).toFixed(1) + '" text-anchor="' + an2 + '" style="fill:var(--bad);font-weight:600">' + t.bMax(money(Math.floor(m.fMax / 10) * 10)) + '</text>';
      }
    } else {
      g += '<text x="' + (W - CPR - 2) + '" y="' + (B > hi0 ? pt + 10 : H - pb - 4) + '" text-anchor="end" style="fill:var(--bad);font-weight:600">' + (B > hi0 ? t.bAbove(money(B)) : t.bBelow(money(B))) + '</text>';
    }
    var xd = X(S.fees), yd = Y(m.M + S.hoa + S.ins + S.tax + m.pmiNow);
    g += '<line x1="' + xd.toFixed(1) + '" x2="' + xd.toFixed(1) + '" y1="' + yd.toFixed(1) + '" y2="' + (H - pb) + '" stroke="var(--now)" stroke-width="1.5" stroke-dasharray="4 3"/>';
    g += '<line x1="' + CPL + '" x2="' + xd.toFixed(1) + '" y1="' + yd.toFixed(1) + '" y2="' + yd.toFixed(1) + '" stroke="var(--later)" stroke-width="1.5" stroke-dasharray="4 3"/>';
    [rates[0], rates[2]].forEach(function(r){
      g += '<circle cx="' + xd.toFixed(1) + '" cy="' + Y(payFor(S.fees, r, m.n)).toFixed(1) + '" r="3.5" fill="var(--surface)" stroke="var(--muted)" stroke-width="1.5"/>';
    });
    g += '<circle cx="' + xd.toFixed(1) + '" cy="' + yd.toFixed(1) + '" r="7" fill="var(--later)" stroke="var(--surface)" stroke-width="2.5"/>';
    [0, 5000, 10000, 15000].forEach(function(f){
      var an = f === 0 ? 'start' : (f === FMAX ? 'end' : 'middle');
      g += '<text x="' + X(f).toFixed(1) + '" y="' + (H - 20) + '" text-anchor="' + an + '">' + kf.format(f) + '</text>';
    });
    g += '<text x="' + ((X(0) + X(FMAX)) / 2).toFixed(1) + '" y="' + (H - 3) + '" text-anchor="middle">' + t.axisX + '</text>';
    box.innerHTML = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" aria-hidden="true">' + g + '</svg>';
    box.setAttribute('aria-label', t.curveAria);

    var F = m.upfrontFees > 0.5 ? m.upfrontFees : 5000;
    var sl = $('slopes');
    sl.innerHTML = '';
    rates.forEach(function(r, k){
      var li = document.createElement('li');
      li.textContent = t.slope(pct(r), money(F), money(pmt(F, r, m.n)));
      if (k === 1) li.className = 'cur';
      sl.appendChild(li);
    });
    var li2 = document.createElement('li');
    li2.textContent = t.slopeSum;
    sl.appendChild(li2);
  }

  function drawChart(m){
    var t = L(), box = $('chart');
    var W = Math.max(260, box.clientWidth || 340), H = 200, pl = 2, pr = 2, pt = 6, pb = 22;
    var yrs = S.term, i = S.disc / 1200, pays = [], pvs = [], tot = 0;
    for (var y = 1; y <= yrs; y++){
      var s = 0;
      var pa = 0;
      for (var k = (y - 1) * 12 + 1; k <= y * 12; k++){ var c = m.M + (k <= m.pmiK ? S.pmi : 0); pa += c; s += c / Math.pow(1 + i, k); }
      pays.push(pa); pvs.push(s); tot += s;
    }
    var paid = Math.max.apply(null, pays);
    var cw = (W - pl - pr) / yrs, bw = Math.max(2, cw * 0.7), h = H - pt - pb;
    var g = '';
    for (var j = 0; j < yrs; j++){
      var x = pl + j * cw + (cw - bw) / 2, hv = pvs[j] / paid * h, hp = pays[j] / paid * h;
      g += '<rect x="' + x.toFixed(1) + '" y="' + (pt + h - hp).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + hp.toFixed(1) + '" rx="1.5" fill="var(--later-soft)"/>';
      g += '<rect x="' + x.toFixed(1) + '" y="' + (pt + h - hv).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + hv.toFixed(1) + '" rx="1.5" fill="var(--later)"/>';
    }
    var ticks = yrs === 30 ? [1, 5, 10, 15, 20, 25, 30] : [1, 5, 10, 15];
    ticks.forEach(function(tk){
      var cx = pl + (tk - 1) * cw + cw / 2;
      if (tk === 1) g += '<text x="' + (pl + (cw - bw) / 2).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="start">' + t.year1 + '</text>';
      else g += '<text x="' + cx.toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle">' + tk + '</text>';
    });
    box.innerHTML = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" aria-hidden="true">' + g + '</svg>';
    box.setAttribute('aria-label', t.chartAria);
    $('lgPaid').textContent = t.lgPaid(money(paid));
    $('lgToday').textContent = t.lgToday;
    $('chartCap').textContent = t.chartCap(pct(S.disc), num(pays[yrs - 1] / pvs[yrs - 1], 1), money(tot));
  }

  function setLang(l){

  var anim = 0;
  function stopAnim(){ if (anim) { cancelAnimationFrame(anim); anim = 0; } }
  function keep(el, fn){
    var before = el.getBoundingClientRect().top;
    fn();
    var d = el.getBoundingClientRect().top - before;
    if (Math.abs(d) > 0.5) window.scrollBy(0, d);
  }
  function bind(id, key, parse){
    $(id).addEventListener('input', function(e){ stopAnim(); keep(e.target, function(){ S[key] = parse(e.target.value); render(); }); });
  }
  function applyEst(){ S.other = Math.round(S.price * OTHER_PCT / 50) * 50; S.pre = Math.round(S.price * PRE_PCT / 50) * 50; S.otherAuto = true; S.preAuto = true; }
  $('price').addEventListener('input', function(e){ stopAnim(); keep(e.target, function(){ S.price = Number(e.target.value); applyEst(); render(); }); });
  bind('cash', 'cash', Number);
  bind('budget', 'budget', Number);
  bind('fees2', 'fees', Number);
  bind('hoa', 'hoa', Number);
  bind('ins', 'ins', Number);
  bind('pmi', 'pmi', Number);
  bind('tax', 'tax', Number);
  $('other').addEventListener('input', function(e){ stopAnim(); keep(e.target, function(){ S.other = Number(e.target.value); S.otherAuto = false; render(); }); });
  $('pre').addEventListener('input', function(e){ stopAnim(); keep(e.target, function(){ S.pre = Number(e.target.value); S.preAuto = false; render(); }); });
  bind('rate', 'rate', Number);
  bind('fees', 'fees', Number);
  $('t15').addEventListener('click', function(e){ var b = e.currentTarget; keep(b, function(){ S.term = 15; render(); }); });
  $('t30').addEventListener('click', function(e){ var b = e.currentTarget; keep(b, function(){ S.term = 30; render(); }); });
  $('disc').addEventListener('input', function(e){ stopAnim(); keep(e.target, function(){ S.discMode = 'custom'; S.disc = Number(e.target.value); render(); }); });
  $('btnRate').addEventListener('click', function(){ stopAnim(); S.discMode = 'rate'; render(); });
  $('btnApr').addEventListener('click', function(){
    stopAnim();
    var target = last ? last.apr : S.disc;
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce){ S.discMode = 'apr'; render(); return; }
    var from = S.disc, t0 = performance.now(), dur = 650;
    S.discMode = 'custom';
    function step(now){
      var k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      S.disc = from + (target - from) * e;
      if (k < 1){ render(); anim = requestAnimationFrame(step); }
      else { anim = 0; S.discMode = 'apr'; render(); }
    }
    anim = requestAnimationFrame(step);
  });
  $('langRu').addEventListener('click', function(){ setLang('ru'); });
  $('langEn').addEventListener('click', function(){ setLang('en'); });

  var dragging = false;
  function curvePick(e){
    var r = $('curve').getBoundingClientRect(), W = Math.max(260, r.width);
    var p = clamp(Math.round((e.clientX - r.left - CPL) / (W - CPL - CPR) * FMAX / 250) * 250, 0, FMAX);
    if (p !== S.fees){ keep($('curve'), function(){ S.fees = p; render(); }); }
  }
  $('curve').addEventListener('pointerdown', function(e){ dragging = true; try { $('curve').setPointerCapture(e.pointerId); } catch (err) {} curvePick(e); });
  $('curve').addEventListener('pointermove', function(e){ if (dragging) curvePick(e); });
  $('curve').addEventListener('pointerup', function(){ dragging = false; });
  $('curve').addEventListener('pointercancel', function(){ dragging = false; });

  function redraw(){ if (last){ drawTrade(last); drawChart(last); } }
  if (window.ResizeObserver){ var ro = new ResizeObserver(redraw); ro.observe($('chart')); ro.observe($('curve')); }
  else window.addEventListener('resize', redraw);

  setLang(S.lang);
})();
</script>
</body>
</html>
